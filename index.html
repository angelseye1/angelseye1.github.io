<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AngelsEye</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Ensure full dynamic viewport height */
    body, html {
      height: 100%;
      margin: 0;
    }

    .bg-hero {
      background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                        url('assets/img/pozadina.jpg');
      
      /* Dynamic full-page coverage & centering */
      min-height: 100vh;
      min-height: 100dvh; /* Accounts for mobile browser address bars */
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
  </style>
</head>
<body>

  <!-- Full-screen container with download button at the bottom -->
  <header class="bg-hero d-flex align-items-end justify-content-center text-center text-white pb-5">
    <div class="container px-4 mb-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <a href="assets/cjenik.xml" download="cjenik.xml" class="btn btn-outline-light btn-lg px-4">
            Cjenik
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
